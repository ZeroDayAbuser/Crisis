<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Link a device</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/device.js"></script></head><body><header><strong>Crisis Account</strong><nav><a href="/account">Account</a><a href="/device">Link a device</a></nav></header><main><h1>Link a device</h1><p class="lead">Enter the code shown on your device. Review its name and requested access before approving.</p><form id="review" class="card"><label for="code">Device code</label><input id="code" name="user_code" autocomplete="one-time-code" maxlength="9" placeholder="ABCD-EFGH" required><button>Review request</button><div id="device-review" hidden><h2>Requested device</h2><p id="device-name"></p><p id="device-scopes" class="muted"></p><div class="actions"><button id="approve" type="button">Approve</button><button id="deny" class="danger" type="button">Deny</button></div></div><div id="notice" class="alert" role="status" aria-live="polite"></div></form></main></body></html>
