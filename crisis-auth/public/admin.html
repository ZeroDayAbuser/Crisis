<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crisis administration</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/admin.js"></script></head><body>
<header><strong>Crisis Administration</strong><nav><a href="/account">User account</a><a href="/admin">Users</a></nav></header><main><h1>Administration</h1><p class="lead">Protected operations are validated, transacted, and audited by the server.</p><div id="notice" class="alert" role="status" aria-live="polite"></div>
<section class="card"><form id="search"><div class="grid"><div><label for="query">Search email</label><input id="query" name="q" type="search"></div><div><label for="status">Status</label><select id="status" name="status"><option value="">All</option><option>active</option><option>suspended</option></select></div></div><button>Search</button></form></section>
<section class="card"><h2>Users</h2><div id="users"></div><div class="actions"><button id="previous" class="secondary" type="button">Previous</button><button id="next" class="secondary" type="button">Next</button></div></section>
<section class="card"><h2>Approved file replacement</h2><form id="upload"><label for="slot">File slot</label><select id="slot" name="slot"><option value="driver">Driver (driver.sys)</option><option value="module-rust">Rust module (rust.dll)</option><option value="module-test">Test module (test-dll.dll)</option></select><label for="file">Replacement file</label><input id="file" name="file" type="file" accept=".sys,.dll" required><label for="upload-reason">Reason</label><input id="upload-reason" name="reason" minlength="3" maxlength="500" required><button class="danger">Validate and replace</button></form></section>
<section id="detail" class="card" hidden><h2 id="detail-email"></h2><div id="detail-stats" class="stats"></div><div class="actions"><button data-action="coins">Adjust coins</button><button data-action="subscription">Adjust time</button><button data-action="hwid-reset" class="secondary">Reset HWID</button><button data-action="status" class="danger">Suspend or restore</button></div><h3>Devices</h3><div id="detail-devices"></div><h3>Audit history</h3><div id="history"></div></section>
<dialog id="confirm"><form id="confirm-form" method="dialog"><h2 id="confirm-title">Confirm operation</h2><div id="value-field"><label for="value">Adjustment</label><input id="value" name="value" type="number"></div><div id="status-field" hidden><label for="new-status">New status</label><select id="new-status" name="new_status"><option value="suspended">Suspend</option><option value="active">Restore</option></select></div><label for="reason">Reason</label><input id="reason" name="reason" minlength="3" maxlength="500" required><div class="actions"><button value="cancel" class="secondary">Cancel</button><button id="confirm-button" value="default" type="submit">Confirm</button></div></form></dialog>
</main></body></html>
